; /etc/asterisk/extensions.conf
[general]
static=yes
writeprotect=no

[internal]
; Gestion des appels en interne et renvoi vers messagerie si non-réponse ou DND (Ne pas déranger)
exten => 200,1,Dial(PJSIP/200,20)
exten => 200,2,VoiceMail(200@default,u)
exten => 200,3,Hangup()

exten => 201,1,Dial(PJSIP/201,20)
exten => 201,2,VoiceMail(201@default,u)
exten => 201,3,Hangup()

exten => 202,1,Dial(PJSIP/202,20)
exten => 202,2,VoiceMail(202@default,u)
exten => 202,3,Hangup()

exten => 203,1,Dial(PJSIP/203,20)
exten => 203,2,VoiceMail(203@default,u)
exten => 203,3,Hangup()

; Numéro pour consulter la messagerie vocale
exten => 800,1,VoiceMailMain(${CALLERID(num)}@default)
exten => 800,2,Hangup()

[incoming]
; Point d'entrée pour les appels venant de l'extérieur (SDA et Numéro Principal)

; -- 1. GESTION DU NUMERO PRINCIPAL (0466666666) --
; Vérification des vacances (du 12/06 au 31/08 environ)
exten => 0466666666,1,GotoIfTime(*,*,12-30,jun?vacances,s,1)
exten => 0466666666,2,GotoIfTime(*,*,*,jul-aug?vacances,s,1)
; Vérification des horaires d'ouverture (8h00 à 18h00)
exten => 0466666666,3,GotoIfTime(08:00-17:59,*,*,*?ivr_menu,s,1)
; Si on arrive ici, c'est que le studio est fermé (nuit)
exten => 0466666666,4,Goto(fermeture_nuit,s,1)

; -- 2. GESTION DES SDA DIRECTS --
; Les SDA doivent aussi respecter le renvoi si l'artiste est absent. On les envoie dans [internal].
exten => 0477777777,1,Goto(internal,200,1)
exten => 0488888888,1,Goto(internal,202,1)

[ivr_menu]
; Menu SVI (Serveur Vocal Interactif)
exten => s,1,Answer()
; Remplacez "custom/menu_atelier" par votre fichier audio
exten => s,2,Background(custom/menu_atelier) 
exten => s,3,WaitExten(5)

; Mapping des touches défini dans le schéma du PDF
exten => 0,1,Goto(internal,200,1)
exten => 1,1,Goto(internal,201,1)
exten => 2,1,Goto(internal,202,1)
exten => 3,1,Goto(internal,203,1)

; Si une touche invalide est pressée
exten => i,1,Playback(invalid)
exten => i,2,Goto(s,1)
; Si timeout (aucune touche)
exten => t,1,Hangup()

[vacances]
exten => s,1,Answer()
exten => s,2,Playback(custom/annonce_vacances)
exten => s,3,Hangup()

[fermeture_nuit]
exten => s,1,Answer()
exten => s,2,Playback(custom/annonce_fermeture)
exten => s,3,Hangup()